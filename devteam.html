<!DOCTYPE html>

<head>
<title>Dev Team</title>
<meta charset="utf-8">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  background-color: #ffffff;
  color: #000000;
  line-height: 1.2;
  -webkit-font-smoothing: antialiased;
  width: 1280px;
  margin: 0 auto;
}

.header {
  position: sticky;
  top: 0;
  background-color: #ffffff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 32px;
  border-bottom: 1px solid #000000;
  z-index: 100;
  width: 1280px;
}

.header-logo {
  font-size: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.nav-links {
  display: flex;
  gap: 32px;
}

.nav-links a {
  text-decoration: none;
  color: #000000;
  font-size: 14px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.nav-links a.active {
  color: #888888; 
  text-decoration: none;
  text-decoration-thickness: 2px;
}

.dev-container {
  padding: 64px 32px;
  display: flex;
  justify-content: center;
  width: 1280px;
}

.dev-grid {
  display: grid;
  grid-template-columns: 280px 280px 280px; 
  gap: 24px;
  width: 888px;
}

.dev-text-block {
  grid-column: span 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-right: 32px;
  height: 280px;
}

.dev-text-block h1 {
  font-size: 72px;
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 0.9;
  margin-bottom: 16px;
}

.dev-text-block p {
  font-size: 24px;
  font-weight: 600;
  line-height: 1.3;
  color: #333333;
}

.dev-link-box {
  outline: 1px solid #000000;
  width: 280px;
  height: 280px; 
  display: block;
  text-decoration: none;
  overflow: hidden;
}

.footer {
  border-top: 1px solid #000000;
  padding: 32px;
  text-align: center;
  font-size: 14px;
  letter-spacing: 1px;
  width: 1280px;
}
</style>
</head>
