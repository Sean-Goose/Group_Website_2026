<!DOCTYPE html>
<html lang="en">
<head>
<title>Dev Team</title>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
body {
  width: 1280px;
  margin: 0 auto;
}
.header {
  width: 1280px;
}
.dev-container {
  padding: 64px 32px;
  display: flex;
  justify-content: center;
  width: 1280px;
}
.dev-grid {
  display: grid;
  grid-template-columns: 280px 280px 280px; 
  gap: 24px;
  width: 888px;
}
.dev-text-block {
  grid-column: span 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-right: 32px;
  height: 280px;
}
.dev-text-block h1 {
  font-size: 72px;
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 0.9;
  margin-bottom: 16px;
}
.dev-text-block p {
  font-size: 24px;
  font-weight: 600;
  line-height: 1.3;
  color: #333333;
}
.dev-link-box {
  outline: 1px solid #000000;
  width: 280px;
  height: 280px; 
  display: block;
  text-decoration: none;
  overflow: hidden;
  position: relative;
}
.dev-link-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: filter 0.3s ease, transform 0.3s ease;
}
.dev-link-box:hover img,
.dev-link-box:focus-visible img {
  filter: blur(6px) brightness(0.7);
  transform: scale(1.05);
}
.dev-name {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #ffffff;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.dev-link-box:hover .dev-name,
.dev-link-box:focus-visible .dev-name {
  opacity: 1;
}
.footer {
  width: 1280px;
}
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">Fundamentals</div>
  <nav class="nav-links">
    <a href="index.html">Course</a>
    <a href="projects.html">Projects</a>
    <a href="concepts.html">Concepts</a>
    <a href="database.html">Database</a>
    <a href="documentation.html">Documentation</a>
    <a href="devteam.html" class="active">Dev Team</a>
  </nav>
</header>

<main class="dev-container">
  <div class="dev-grid">
    <div class="dev-text-block">
      <h1>Our<br>Websites</h1>
      <p>Click on the image to go to<br>any of our websites!</p>
    </div>
    <a href="https://2026165958.github.io/foc1/" class="dev-link-box">
      <img src="Barackbutt.png" alt="Barack's Website Preview">
      <span class="dev-name">Barack</span>
    </a>
    <a href="https://byroncoc-source.github.io/foc/" class="dev-link-box">
      <img src="byron.jpg" alt="Byron's Website Preview">
      <span class="dev-name">Byron</span>
    </a>
    <a href="https://sean-goose.github.io/FoC2026/devteam.html" class="dev-link-box">
      <img src="pfp.JPG" alt="Sean's Website Preview">
      <span class="dev-name">Sean</span>
    </a>
    <a href="https://2026165  564-cpu.github.io/FOC/" class="dev-link-box">
      <img src="Dominic.jpg" alt="Dominic's Website Preview">
      <span class="dev-name">Dominic</span>
    </a>
    <a href="https://jensanchez06.github.io/Final-Project/" class="dev-link-box">
      <img src="jen.png" alt="Jen's Website Preview">
      <span class="dev-name">Jen</span>
    </a>
    <a href="https://2025162827-tech.github.io/carloschulin-website/" class="dev-link-box">
      <img src="carlos.jpeg" alt="Carlos' Website Preview">
      <span class="dev-name">Carlos</span>
    </a>
    <a href="https://2025162554-arch.github.io/foc/" class="dev-link-box">
      <img src="kiyanee.png" alt="Kiyanee's Website Preview">
      <span class="dev-name">Kiyanee</span>
    </a>
  </div>
</main>

<footer class="footer">
  GROUP WEBSITE 2026
</footer>

</body>
</html>
